name: Inspect Cloudflare API & Edge Security

on:
  workflow_dispatch:

jobs:
  inspect-cloudflare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 1. Fetch All Account Zones
        run: |
          echo "=== ZONES IN ACCOUNT ==="
          curl -s -X GET "https://api.cloudflare.com/client/v4/zones" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '.result[] | {id: .id, name: .name, status: .status}'

      - name: 2. Fetch Security Level & Bot Settings for albertlane.net
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=albertlane.net" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id')
          
          echo "Target Zone ID: $ZONE_ID"
          
          if [ -n "$ZONE_ID" ] && [ "$ZONE_ID" != "null" ]; then
            echo "=== SECURITY LEVEL ==="
            curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/security_level" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq .result

            echo "=== BOT FIGHT MODE SETTING ==="
            curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/bot_fight_mode" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq .result

            echo "=== WAF RULESETS IN PHASE: http_request_firewall_custom ==="
            curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/rulesets/phases/http_request_firewall_custom/entrypoint" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq .result.rules
          fi

      - name: 3. Inspect Worker Custom Domains
        run: |
          echo "=== WORKER CUSTOM DOMAINS ==="
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq .result
