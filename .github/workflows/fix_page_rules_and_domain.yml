name: Fix Page Rules and Provision Worker Custom Domain

on:
  workflow_dispatch:

jobs:
  fix-cloudflare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 1. Delete Overlimit Page Rule (*.albertlane.net/*)
        run: |
          ZONE_ID="80a9f1b37935fb33771c241be1172699"

          # Fetch all Page Rules
          PAGE_RULES=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/pagerules" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          # Find rule matching *.albertlane.net/*
          RULE_ID=$(echo "$PAGE_RULES" | grep -B2 '"targets":.*\*.\albertlane.net/\*' | grep -o '"id":"[^"]*' | head -n 1 | cut -d'"' -f4)

          if [ -n "$RULE_ID" ]; then
            echo "Deleting intercepting Page Rule ID: $RULE_ID"
            curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/pagerules/$RULE_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            echo "Page Rule removed successfully."
          else
            echo "Target Page Rule not found or already deleted."
          fi

      - name: 2. Attach True Worker Custom Domain
        run: |
          ZONE_ID="80a9f1b37935fb33771c241be1172699"

          # Provision provenance.albertlane.net as a Worker Custom Domain
          RESPONSE=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"zone_id\": \"$ZONE_ID\",
              \"hostname\": \"provenance.albertlane.net\",
              \"service\": \"lane-vm-sovereign-worker\",
              \"environment\": \"production\"
            }")

          echo "Custom Domain Attachment Result:"
          echo "$RESPONSE"
