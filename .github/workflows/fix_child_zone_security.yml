name: Disable Security Challenges on Provenance Child Zone

on:
  workflow_dispatch:

jobs:
  fix-child-zone:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Locate Child Zone ID & Lower Security Level
        run: |
          # Fetch the exact Zone ID for provenance.albertlane.net
          CHILD_ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=provenance.albertlane.net" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | grep -o '"id":"[^"]*' | head -n 1 | cut -d'"' -f4)

          echo "Target Child Zone ID: $CHILD_ZONE_ID"

          if [ -n "$CHILD_ZONE_ID" ]; then
            # 1. Lower Security Level on child zone
            curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$CHILD_ZONE_ID/settings/security_level" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"value": "essentially_off"}'

            # 2. Disable Bot Fight Mode on child zone
            curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$CHILD_ZONE_ID/settings/bot_fight_mode" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"value": "off"}'

            # 3. Apply WAF custom skip rule on child zone entrypoint
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CHILD_ZONE_ID/rulesets/phases/http_request_firewall_custom/entrypoint" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "rules": [
                  {
                    "action": "skip",
                    "action_parameters": {
                      "bic": true,
                      "hot": true,
                      "security_level": true,
                      "managed_challenge": true,
                      "js_challenge": true
                    },
                    "expression": "(true)",
                    "description": "Global challenge skip on provenance child zone"
                  }
                ]
              }'
            echo "Child zone security updated."
          else
            echo "Child zone 'provenance.albertlane.net' not explicitly found; check permissions."
          fi
