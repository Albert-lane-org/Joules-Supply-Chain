name: Completely Remove Cloudflare Access Policies

on:
  workflow_dispatch:

jobs:
  remove-access:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Delete All Access Applications Across Account
        run: |
          # 1. Fetch all Access Applications
          APPS_RESPONSE=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          APP_IDS=$(echo "$APPS_RESPONSE" | grep -o '"id":"[^"]*' | cut -d'"' -f4)

          for APP_ID in $APP_IDS; do
            echo "Deleting Access Application: $APP_ID"
            curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$APP_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          done

          echo "Cloudflare Access Applications wiped."
