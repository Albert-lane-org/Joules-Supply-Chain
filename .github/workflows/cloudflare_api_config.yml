name: Cloudflare API Auto-Config & Endpoint Discovery

on:
  workflow_dispatch:

jobs:
  configure-cloudflare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Fetch Account Subdomain & Worker Endpoint
        run: |
          SUBDOMAIN=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | grep -o '"subdomain":"[^"]*' | cut -d'"' -f4)
          
          echo "========================================================="
          echo "LIVE WORKER SUBDOMAIN: $SUBDOMAIN"
          echo "LIVE WORKER ENDPOINT: https://lane-vm-sovereign-worker.$SUBDOMAIN.workers.dev"
          echo "========================================================="

      - name: Bypass Bot Challenge via Firewall Access Rule
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=albertlane.net" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | grep -o '"id":"[^"]*' | head -n 1 | cut -d'"' -f4)
          
          echo "Zone ID: $ZONE_ID"
          
          if [ -n "$ZONE_ID" ]; then
            # Whitelist GitHub Runner & API User Agents via Zone Firewall Access Rule
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/firewall/access_rules/rules" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "mode": "whitelist",
                "configuration": {
                  "target": "user_agent",
                  "value": "Sovereign-Auditor-CLI/1.0"
                },
                "notes": "Allow Sovereign CLI requests to bypass Turnstile challenge"
              }'
            echo "User-Agent access rule added successfully."
          fi
