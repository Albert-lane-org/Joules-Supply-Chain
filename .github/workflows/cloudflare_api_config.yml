name: Cloudflare API Auto-Config & Endpoint Discovery

on:
  workflow_dispatch:

jobs:
  configure-cloudflare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Fetch Account Subdomain & Worker Endpoint
        run: |
          SUBDOMAIN=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | grep -o '"subdomain":"[^"]*' | cut -d'"' -f4)
          
          echo "========================================================="
          echo "LIVE WORKER ENDPOINT: https://lane-vm-sovereign-worker.$SUBDOMAIN.workers.dev"
          echo "========================================================="

      - name: Disable Security Challenge for Provenance Path on albertlane.net
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=albertlane.net" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | grep -o '"id":"[^"]*' | head -n 1 | cut -d'"' -f4)
          
          if [ -n "$ZONE_ID" ]; then
            echo "Zone ID found: $ZONE_ID. Setting security level to allow API/JSON-LD traffic..."
            curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/security_level" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"value": "essentially_off"}'
            echo "WAF security level updated successfully."
          else
            echo "Could not fetch Zone ID for albertlane.net. Verify API token zone permissions."
          fi
