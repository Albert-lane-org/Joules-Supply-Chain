name: Cloudflare API Auto-Config & Endpoint Discovery

on:
  workflow_dispatch:

jobs:
  configure-cloudflare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Fetch Account Subdomain & Worker Endpoint
        run: |
          RESPONSE=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "Subdomain Response: $RESPONSE"

      - name: Create WAF Bypass Rule for Provenance Path
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=albertlane.net" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | grep -o '"id":"[^"]*' | head -n 1 | cut -d'"' -f4)
          
          echo "Zone ID: $ZONE_ID"
          
          if [ -n "$ZONE_ID" ]; then
            # Deploy a custom ruleset entry to bypass security checks for the JSON-LD path
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/rulesets/phases/http_request_firewall_custom/entrypoint" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "rules": [
                  {
                    "action": "skip",
                    "action_parameters": {
                      "bic": true,
                      "hot": true,
                      "security_level": true
                    },
                    "expression": "(http.request.uri.path eq \"/.provenance.jsonld\")",
                    "description": "Allow CLI access to provenance jsonld"
                  }
                ]
              }'
          fi
