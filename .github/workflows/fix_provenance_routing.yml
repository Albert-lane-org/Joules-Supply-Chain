name: Fix Provenance Domain Routing

on:
  workflow_dispatch:

jobs:
  fix-routing:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Purge Stale Pages Domain Bindings
        run: |
          PROJECTS=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          PROJECT_NAMES=$(echo "$PROJECTS" | grep -o '"name":"[^"]*' | cut -d'"' -f4)

          for PROJ in $PROJECT_NAMES; do
            DOMAINS=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJ/domains" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            DOMAIN_NAMES=$(echo "$DOMAINS" | grep -o '"name":"[^"]*' | cut -d'"' -f4)

            for DOM in $DOMAIN_NAMES; do
              if [[ "$DOM" == *"provenance.albertlane.net"* ]] || [[ "$DOM" == "albertlane.net" ]]; then
                echo "Removing stale Pages domain: $DOM from project $PROJ"
                curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJ/domains/$DOM" \
                  -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
              fi
            done
          done

      - name: 2. Ensure Proxied CNAME DNS Record Exists
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=albertlane.net" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | grep -o '"id":"[^"]*' | head -n 1 | cut -d'"' -f4)

          if [ -n "$ZONE_ID" ]; then
            # Create or update DNS CNAME for provenance pointing to Worker
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "type": "CNAME",
                "name": "provenance",
                "content": "lane-vm-sovereign-worker.albertlane.workers.dev",
                "ttl": 1,
                "proxied": true
              }'
          fi

      - name: 3. Deploy Worker with Custom Domain
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
