name: Deploy Cloudflare WAF Custom Skip Rule

on:
  workflow_dispatch:

jobs:
  deploy-waf-skip:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Disable Bot Fight Mode & Security Challenges
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=albertlane.net" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | grep -o '"id":"[^"]*' | head -n 1 | cut -d'"' -f4)

          echo "Target Zone ID: $ZONE_ID"

          if [ -n "$ZONE_ID" ]; then
            # 1. Disable Bot Fight Mode challenge layer
            curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/bot_fight_mode" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"value": "off"}'

            # 2. Lower Zone Security Level to essentially_off for API traffic
            curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/security_level" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"value": "essentially_off"}'

            echo "Zone settings updated successfully."
          fi
