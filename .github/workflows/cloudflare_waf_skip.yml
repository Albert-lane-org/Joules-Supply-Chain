name: Deploy Cloudflare WAF Custom Skip Rule

on:
  workflow_dispatch:

jobs:
  deploy-waf-skip:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Fetch Zone ID & Deploy Ruleset Skip Entry
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=albertlane.net" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | grep -o '"id":"[^"]*' | head -n 1 | cut -d'"' -f4)

          echo "Target Zone ID: $ZONE_ID"

          if [ -n "$ZONE_ID" ]; then
            # Post custom rule to the HTTP Request Firewall Custom phase
            RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/rulesets/phases/http_request_firewall_custom/entrypoint" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "rules": [
                  {
                    "action": "skip",
                    "action_parameters": {
                      "bic": true,
                      "hot": true,
                      "security_level": true
                    },
                    "expression": "(http.request.uri.path eq \"/.provenance.jsonld\") or (http.request.uri.path contains \"/api/scaffold/\")",
                    "description": "RFC 0103 CLI & Webhook WAF Bypass"
                  }
                ]
              }')
            
            echo "Cloudflare API Response:"
            echo "$RESPONSE"
          else
            echo "Error: Failed to resolve Zone ID for albertlane.net"
            exit 1
          fi
