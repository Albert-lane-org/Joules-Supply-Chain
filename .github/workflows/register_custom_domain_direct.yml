name: Register Direct Worker Custom Domain

on:
  workflow_dispatch:

jobs:
  bind-domain:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Attach provenance.albertlane.net as Worker Custom Domain
        run: |
          ZONE_ID="80a9f1b37935fb33771c241be1172699"

          RESPONSE=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"zone_id\": \"$ZONE_ID\",
              \"hostname\": \"provenance.albertlane.net\",
              \"service\": \"lane-vm-sovereign-worker\",
              \"environment\": \"production\"
            }")

          echo "Registration Result:"
          echo "$RESPONSE"
