name: Lane-VM C++ & Julia Native Architecture Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install C++ and Julia Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential julia

      - name: Verify Architecture Engine
        run: |
          julia --version
          echo "Native architecture environment verified."
