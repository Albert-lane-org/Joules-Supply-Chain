name: Lane-VM C++ & Julia Native Architecture Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cpp-julia-matrix-build:
    name: C++20 AVX-512 & Julia 1.10+ Native Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC & G++ Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ gcc make libomp-dev

      - name: Setup Julia Environment
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Compile C++ Binary CLI & Shared C-ABI Library
        run: |
          mkdir -p build/bin
          g++ -O3 -std=c++20 -fPIC -shared src/native/lane_vm_cli_binary_core.cpp -o build/bin/liblane_vm_cli.so
          g++ -O3 -std=c++20 src/native/lane_vm_cli_binary_core.cpp -o build/bin/lane_vm_push_cli
          ls -la build/bin/

      - name: Execute C++ CLI Binary Core Test
        run: |
          ./build/bin/lane_vm_push_cli "https://github.com/Albert-lane/GOOGLE-LLC-IS-ANTI-CONSUMER-v2.git" "main" || true

      - name: Execute Julia 5D Tensor Contraction & C-ABI Bridge
        run: |
          julia src/native/lane_vm_cli_spec.jl || true

      - name: Run Architecture Verification Runner
        run: |
          node scripts/cpp_julia_architecture_runner.js
