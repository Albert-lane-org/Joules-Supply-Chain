name: Lane-VM C++ & Julia Native Architecture Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install C++ Dependencies & Official Julia Binary
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl
          curl -sL https://julialang-s3.julialang.org/bin/linux/x64/1.10/julia-1.10.2-linux-x86_64.tar.gz | tar -xz -C /tmp
          sudo ln -s /tmp/julia-1.10.2/bin/julia /usr/local/bin/julia

      - name: Verify Architecture Engine
        run: |
          julia --version
          echo "Native architecture environment verified."
