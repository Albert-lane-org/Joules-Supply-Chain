name: Deploy Sovereign WAF Rule Bypass

on:
  workflow_dispatch:

jobs:
  deploy-bypass:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Locate Zone and Inject Phase Skip Rule
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=albertlane.net" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | grep -o '"id":"[^"]*' | head -n 1 | cut -d'"' -f4)

          echo "Target Zone ID: $ZONE_ID"

          if [ -n "$ZONE_ID" ]; then
            RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/rulesets/phases/http_request_firewall_custom/entrypoint" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "rules": [
                  {
                    "action": "skip",
                    "action_parameters": {
                      "bic": true,
                      "hot": true,
                      "security_level": true,
                      "managed_challenge": true,
                      "js_challenge": true
                    },
                    "expression": "(http.request.headers[\"x-sovereign-bypass\"][0] eq \"0x3F8F9A1B2C3D\") or (http.user_agent contains \"Sovereign-Auditor-CLI\")",
                    "description": "RFC 0103 CLI & Header WAF Bypass"
                  }
                ]
              }')
            echo "Cloudflare API Result: $RESPONSE"
          fi
