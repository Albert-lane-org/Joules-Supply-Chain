name: Deploy Cloudflare Access Bypass Policy

on:
  workflow_dispatch:

jobs:
  bypass-access:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Fetch Zero Trust Apps & Push Bypass Policy
        run: |
          # Fetch all Access Applications under the Account
          APPS_RESPONSE=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          echo "Access Apps Payload:"
          echo "$APPS_RESPONSE"

          # Extract App ID for lane-vm-sovereign-worker
          APP_ID=$(echo "$APPS_RESPONSE" | grep -o '"id":"[^"]*' | head -n 1 | cut -d'"' -f4)

          if [ -n "$APP_ID" ]; then
            echo "Creating Bypass Policy for Access App: $APP_ID"
            
            # Create a Policy with decision: "bypass" for public path
            curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$APP_ID/policies" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "Bypass RFC 0103 Provenance Endpoint",
                "decision": "bypass",
                "include": [
                  { "everyone": {} }
                ],
                "path": "/.provenance.jsonld"
              }'
            echo "Access Bypass Policy applied successfully."
          else
            echo "No Access Application found under Account $CLOUDFLARE_ACCOUNT_ID"
          fi
