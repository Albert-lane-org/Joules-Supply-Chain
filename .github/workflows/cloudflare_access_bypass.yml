name: Deploy Cloudflare Access Bypass Policy

on:
  workflow_dispatch:

jobs:
  bypass-access:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inject Bypass Policy into All Access Applications
        run: |
          # Fetch all Access Apps
          APPS_RESPONSE=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          echo "Found Applications Payload:"
          echo "$APPS_RESPONSE"

          # Iterate through all application IDs and attach the bypass policy
          APP_IDS=$(echo "$APPS_RESPONSE" | grep -o '"id":"[^"]*' | cut -d'"' -f4)

          for APP_ID in $APP_IDS; do
            echo "Applying Bypass Policy to Access App: $APP_ID"
            curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$APP_ID/policies" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "Bypass RFC 0103 Provenance Endpoint",
                "decision": "bypass",
                "include": [
                  { "everyone": {} }
                ],
                "path": "/.provenance.jsonld"
              }'
          done
