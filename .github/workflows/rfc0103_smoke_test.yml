name: Lane-VM RFC 0103 Smoke Test & Lockfile Provenance Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke-test-matrix:
    name: Node Runtime Matrix & RFC 0103 Blanket Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x', '24.x']

    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
        continue-on-error: true

      - name: Verify Lockfile & Dependency Integrity
        run: |
          echo ">> Auditing package.json & lockfile synchronization..."
          test -f bun.lock && echo ">> Bun lockfile attested."
          test -f package.json && echo ">> Package manifest attested."

      - name: Execute Recursive RFC 0103 Smoke Test
        run: |
          node scripts/smoke_test_and_rfc0103_audit.js

      - name: TypeScript Static Safety Build
        run: |
          npm run lint || npx tsc --noEmit
