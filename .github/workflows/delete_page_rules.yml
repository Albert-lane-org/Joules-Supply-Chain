name: Delete Intercepting Page Rules

on:
  workflow_dispatch:

jobs:
  purge-rules:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Fetch and Delete All Zone Page Rules
        run: |
          ZONE_ID="80a9f1b37935fb33771c241be1172699"

          RULES_JSON=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/pagerules" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          echo "Page Rules Payload:"
          echo "$RULES_JSON"

          RULE_IDS=$(echo "$RULES_JSON" | grep -o '"id":"[^"]*' | cut -d'"' -f4)

          for RULE_ID in $RULE_IDS; do
            echo "Deleting Page Rule: $RULE_ID"
            curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/pagerules/$RULE_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          done
          echo "Page rules successfully cleared."
