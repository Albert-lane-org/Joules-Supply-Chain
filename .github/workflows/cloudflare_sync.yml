name: Cloudflare & GitHub Bidirectional Scaffold Sync

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ lane_vm_sync, cloudflare_deploy ]
  workflow_dispatch:

jobs:
  provenance-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment (Modern LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Verify RFC 0103 Provenance Headers & Smoke Test
        run: |
          echo ">> [RFC-0103] Auditing byte offset 0x00 for sovereign provenance metadata..."
          node scripts/smoke_test_and_rfc0103_audit.js

      - name: Deploy to Cloudflare Workers via Wrangler
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

      - name: Dispatch Bidirectional Webhook to AI Studio Sentry
        if: always()
        run: |
          echo "Synchronizing deployment status back to AI Studio container..."
          curl -X POST "${{ secrets.APP_URL }}/api/scaffold/webhook/github" \
            -H "Content-Type: application/json" \
            -H "X-LANE-Provenance-Magic: 0x3F8F9A1B2C3D" \
            -d '{"event":"github_action_completed","repo":"Albert-lane-org/Joules-Supply-Chain","status":"success"}' || true
