name: Purge Stale Cloudflare Pages Custom Domains

on:
  workflow_dispatch:

jobs:
  purge-pages-domains:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: List and Remove Stale Domain Bindings from Pages
        run: |
          # 1. Fetch all Pages projects under Account
          PROJECTS=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          PROJECT_NAMES=$(echo "$PROJECTS" | grep -o '"name":"[^"]*' | cut -d'"' -f4)

          for PROJ in $PROJECT_NAMES; do
            echo "Checking Pages Project: $PROJ"
            
            # Fetch custom domains bound to this Pages project
            DOMAINS=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJ/domains" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

            DOMAIN_NAMES=$(echo "$DOMAINS" | grep -o '"name":"[^"]*' | cut -d'"' -f4)

            for DOM in $DOMAIN_NAMES; do
              if [[ "$DOM" == *"albertlane.net"* ]]; then
                echo "Removing stale domain $DOM from Pages project $PROJ..."
                curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJ/domains/$DOM" \
                  -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
              fi
            done
          done
          echo "Pages custom domain purge complete."
